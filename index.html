<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Keatland</title>
  <meta name="description" content="Keatland: the central hub. A first-person surreal world." />
  <style>
    @font-face { font-family: 'Permanent Marker'; src: url('./fonts/permanent-marker.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Special Elite'; src: url('./fonts/special-elite.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Rubik Wet Paint'; src: url('./fonts/rubik-wet-paint.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Rye'; src: url('./fonts/rye.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'Oswald'; src: url('./fonts/oswald.ttf') format('truetype'); font-weight: 200 700; font-display: block; }
    @font-face { font-family: 'VT323'; src: url('./fonts/vt323.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'Caveat'; src: url('./fonts/caveat.ttf') format('truetype'); font-weight: 400 700; font-display: block; }
    html, body { margin: 0; height: 100%; background: #030305; overflow: hidden; overscroll-behavior: none; }
    canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: none; touch-action: none; }
    #enter { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, rgba(30,14,20,.55), rgba(3,3,5,.92) 70%); color: #cfc6b4; cursor: pointer; transition: opacity 2.4s ease; z-index: 2; }
    #enter.gone { opacity: 0; pointer-events: none; }
    #enter .t { font-family: 'Rubik Wet Paint', serif; font-size: clamp(48px, 9vw, 120px); letter-spacing: .04em; color: #d9c98f; opacity: .82; text-shadow: 0 0 40px rgba(255,170,90,.25); }
    #enter .s { margin-top: 10px; font-family: 'Special Elite', monospace; font-size: 14px; letter-spacing: .3em; text-transform: lowercase; opacity: .5; text-align: center; }
    #enter .k { margin-top: 26px; font-family: 'Special Elite', monospace; font-size: 12px; letter-spacing: .14em; opacity: .32; text-align: center; line-height: 1.9; }
    #enter.loading .s::after { content: ' \2026'; }
    #hint { position: fixed; left: 50%; bottom: 13vh; transform: translateX(-50%); font-family: 'Special Elite', monospace; color: #bfe9f0; font-size: 13px; letter-spacing: .25em; opacity: 0; transition: opacity .8s; pointer-events: none; text-shadow: 0 0 10px rgba(127,214,200,.6); z-index: 1; }
    #hint b { display: inline-block; width: 26px; height: 26px; line-height: 26px; text-align: center; border: 1px solid rgba(191,233,240,.45); border-radius: 50%; margin-right: 10px; font-weight: normal; }
    #hint.on { opacity: .75; }
    /* the voice: barely-there letters that surface and dissolve back into the leaves */
    #voice-text { position: fixed; font-family: 'Special Elite', monospace; font-size: 22px; letter-spacing: .6em; color: #cfeec0; opacity: 0; pointer-events: none; z-index: 1; white-space: nowrap; text-shadow: 0 0 14px rgba(140,255,170,.45); filter: blur(3px); }
    #voice-text.on { animation: voice-dissolve 6s ease-in-out forwards; }
    @keyframes voice-dissolve { 0% { opacity: 0; filter: blur(6px); letter-spacing: .3em; } 30% { opacity: .2; filter: blur(1.2px); } 65% { opacity: .14; filter: blur(2px); } 100% { opacity: 0; filter: blur(9px); letter-spacing: 1.1em; transform: translateY(-14px); } }
    #reticle { position: fixed; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; background: rgba(220,210,190,.35); z-index: 1; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="world"></canvas>
  <div id="reticle"></div>
  <div id="hint"><b>E</b><span id="hint-text">pull</span></div>
  <div id="voice-text"></div>
  <div id="enter" class="loading">
    <div>
      <div class="t">Keatland</div>
      <div class="s" id="enter-status">it is growing</div>
      <div class="k">mouse to look &middot; W A S D to walk &middot; shift to run &middot; E to touch things<br/>headphones help</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
